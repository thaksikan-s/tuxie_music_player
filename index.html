<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070709">
    <meta name="description" content="Tuxie Music Player — your music, beautifully close.">
    <title>Tuxie Music Player</title>
    <link rel="icon" href="./assets/branding/tuxie-app-icon-512.png" type="image/png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="app-shell">
      <aside class="sidebar glass-panel" aria-label="Main navigation">
        <a class="brand" href="#" data-page="home" aria-label="Tuxie Music Player home">
          <img class="brand-portrait" src="./assets/branding/tuxie-avatar-512.jpg" alt="">
          <span>Tuxie<span class="brand-sub">MUSIC PLAYER</span></span>
        </a>
        <div class="nav-label">DISCOVER</div>
        <nav class="primary-nav">
          <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span>Home</button>
          <button class="nav-item" data-page="discover"><span class="nav-icon">✧</span>Explore</button>
          <button class="nav-item" data-page="search"><span class="nav-icon">⌕</span>Search</button>
          <button class="nav-item" data-page="library"><span class="nav-icon">◫</span>Your library</button>
          <button class="nav-item" data-page="albums"><span class="nav-icon">▧</span>Albums</button>
          <button class="nav-item" data-page="artists"><span class="nav-icon">◉</span>Artists</button>
          <button class="nav-item" data-page="recent"><span class="nav-icon">◷</span>Recently played</button>
          <button class="nav-item" data-page="favorites"><span class="nav-icon">♡</span>Favourites</button>
          <button class="nav-item" data-page="queue"><span class="nav-icon">≡</span>Queue</button>
          <button class="nav-item" data-page="downloads"><span class="nav-icon">↧</span>Downloads</button>
          <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
          <button class="nav-item" data-page="about"><span class="nav-icon">ⓘ</span>About Tuxie</button>
        </nav>
        <div class="nav-label playlist-label">YOUR COLLECTION <button class="tiny-add" id="create-playlist" aria-label="Create a playlist">＋</button></div>
        <nav class="playlist-nav" id="sidebar-playlists"></nav>
        <div class="sidebar-spacer"></div>
        <button class="import-card" id="import-button">
          <span class="import-icon">↥</span>
          <span><strong>Bring your music</strong><small>Import audio from this device</small></span>
          <span class="import-arrow">↗</span>
        </button>
        <button class="profile" id="profile-settings" aria-label="Open settings">
          <div class="profile-avatar"><img src="./assets/branding/tuxie-avatar-512.jpg" alt=""></div>
          <div><strong>Your listening space</strong><small>Made for this moment</small></div>
          <span class="profile-dots">···</span>
        </button>
      </aside>

      <main class="main-column">
        <header class="topbar">
          <div class="history-buttons"><button aria-label="Back" id="go-back">‹</button><button aria-label="Forward" id="go-forward">›</button></div>
          <div class="topbar-right"><span class="quiet-status"><i></i> YOUR SPACE, YOUR SOUND</span><button class="top-avatar" id="open-settings" aria-label="Open settings"><img src="./assets/branding/tuxie-avatar-512.jpg" alt=""></button></div>
        </header>
        <section id="page-content" aria-live="polite"></section>
      </main>

      <aside class="right-rail">
        <div class="rail-heading"><span>UP NEXT</span><button class="icon-button" id="queue-shuffle" aria-label="Shuffle playback">⤨</button></div>
        <div class="queue-summary"><span id="queue-count">1 track</span><button id="clear-queue">Clear</button></div>
        <div id="queue-list" class="queue-list"></div>
        <div class="rail-divider"></div>
        <div class="sound-note">
          <div class="note-icon">✦</div>
          <span class="eyebrow">A NOTE ON SOUND</span>
          <p>Your music stays on your device. Select MP3s or other audio files to build an offline library.</p>
          <button id="rail-import">Import your music <span>↗</span></button>
        </div>
        <div class="rail-bottom"><span class="secure-dot"></span> PRIVATE BY DESIGN</div>
      </aside>
    </div>

    <div class="mini-player glass-panel" id="mini-player">
      <div class="mini-track" id="mini-track" role="button" tabindex="0" aria-label="Open full player"></div>
      <div class="player-center">
        <div class="transport">
          <button class="player-icon" id="shuffle-button" aria-label="Shuffle">⤨</button>
          <button class="player-icon skip-button" id="previous-button" aria-label="Previous track">|‹</button>
          <button class="play-button" id="play-button" aria-label="Play">▶</button>
          <button class="player-icon skip-button" id="next-button" aria-label="Next track">›|</button>
          <button class="player-icon" id="repeat-button" aria-label="Repeat">↻</button>
        </div>
        <div class="timeline"><span id="current-time">0:00</span><input id="seek-slider" type="range" min="0" max="100" value="0" aria-label="Seek"><span id="total-time">0:00</span></div>
      </div>
      <div class="player-actions"><button class="player-icon heart-button" id="player-favorite" aria-label="Add to favorites">♡</button><button class="player-icon volume-button" aria-label="Volume">◖</button><input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"><button class="player-icon expand-button" id="expand-player" aria-label="Open full player">⤢</button></div>
    </div>
    <nav class="mobile-nav liquid-dock glass-panel" aria-label="Primary navigation">
      <div class="liquid-dock-segments">
        <button class="active" data-page="home" aria-label="Home">⌂<span>Home</span></button>
        <button data-page="library" aria-label="Library">♫<span>Library</span></button>
        <button data-page="settings" aria-label="Settings">⚙<span>Settings</span></button>
      </div>
      <button class="liquid-search-lens" data-page="search" aria-label="Search your music">⌕<span>Search</span></button>
    </nav>
    <input id="file-input" type="file" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus,.wma" multiple hidden>
    <input id="folder-input" type="file" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus,.wma" webkitdirectory directory multiple hidden>
    <input id="lyrics-input" type="file" accept=".lrc,text/plain" hidden>
    <audio id="audio-element" preload="metadata"></audio>
    <div id="toast" role="status" aria-live="polite" class="toast"></div>
    <div id="dialog-layer" class="dialog-layer" hidden>
      <section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <button class="dialog-close" id="dialog-close" aria-label="Close dialog">×</button>
        <div id="dialog-body"></div>
      </section>
    </div>
    <div id="now-playing" class="now-playing hidden" aria-hidden="true"></div>
    <script src="./library-state.js"></script>
    <script src="./app.js"></script>
    <script src="./offline-ui.js"></script>
  </body>
</html>
